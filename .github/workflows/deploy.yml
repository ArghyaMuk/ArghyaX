name: Deploy ctOS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # 1. Validation & Integrity Check
  validate:
    name: 🧪 Validate Code & Assets
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🔍 Validate JavaScript Syntax
        run: |
          echo "Validating JavaScript files..."
          for file in js/*.js; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              node -c "$file"
            fi
          done
          echo "✅ All JavaScript files passed syntax verification."

      - name: 🖼️ Verify Static Assets
        run: |
          echo "Checking essential portfolio assets..."
          test -f index.html || (echo "❌ index.html missing" && exit 1)
          test -f css/style.css || (echo "❌ css/style.css missing" && exit 1)
          test -f js/audio.js || (echo "❌ js/audio.js missing" && exit 1)
          test -f js/main.js || (echo "❌ js/main.js missing" && exit 1)
          test -f js/agentic-simulator.js || (echo "❌ js/agentic-simulator.js missing" && exit 1)
          test -f js/terminal.js || (echo "❌ js/terminal.js missing" && exit 1)
          test -f js/chatbot.js || (echo "❌ js/chatbot.js missing" && exit 1)
          test -f js/watchdogs-loader.js || (echo "❌ js/watchdogs-loader.js missing" && exit 1)
          test -f js/ascii-glitch.js || (echo "❌ js/ascii-glitch.js missing" && exit 1)
          test -f js/kill-switch.js || (echo "❌ js/kill-switch.js missing" && exit 1)
          echo "✅ All core assets and files verified successfully."

  # 2. Build & Deploy to GitHub Pages (GitHub Actions & Branch Dual-Target)
  deploy:
    name: 🚀 Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🌐 Setup GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: 📦 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: '.'

      - name: 🚀 Deploy via GitHub Actions
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 🌿 Deploy to gh-pages Branch (Fail-Safe)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: false
